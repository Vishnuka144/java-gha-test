name: Java Maven CI-CD Pipeline

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:

  build:
    runs-on: self-hosted

    steps:
      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Configure Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Build application
      - name: Maven Clean and Build
        shell: cmd
        run: mvn clean package

      # Upload JAR artifact
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-application
          path: target/*.jar
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: self-hosted

    if: github.event_name != 'pull_request'

    steps:
      # Download artifact
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-application
          path: deployment
name: Java Maven CI-CD Pipeline

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:

  build:
    runs-on: self-hosted

    steps:
      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Configure Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Build application
      - name: Maven Clean and Build
        shell: cmd
        run: mvn clean package

      # Upload JAR artifact
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-application 
          path: target/*.jar
          if-no-files-found: error
  deploy:
  needs: build
  runs-on: self-hosted
  if: github.event_name != 'pull_request'

  steps:
    # Download JAR
    - name: Download JAR Artifact
      uses: actions/download-artifact@v4
      with:
        name: java-application
        path: deployment

    # Create deployment directory
    - name: Prepare Deployment
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force `
          -Path "C:\JavaDeployment"

        Copy-Item "deployment\*.jar" `
          "C:\JavaDeployment\application.jar" -Force

    # Stop previous application instance
    - name: Stop Existing Application
      shell: powershell
      run: |
        $processes = Get-CimInstance Win32_Process |
          Where-Object {
            $_.CommandLine -like "*C:\JavaDeployment\application.jar*"
          }

        foreach ($p in $processes) {
          Stop-Process -Id $p.ProcessId -Force
        }

    # Start application
    - name: Start Java Application
      shell: powershell
      run: |
        $process = Start-Process `
          -FilePath "java" `
          -ArgumentList "-jar C:\JavaDeployment\application.jar" `
          -WorkingDirectory "C:\JavaDeployment" `
          -RedirectStandardOutput "C:\JavaDeployment\app.log" `
          -RedirectStandardError "C:\JavaDeployment\error.log" `
          -PassThru

        Start-Sleep -Seconds 5

        if ($process.HasExited) {
          Get-Content "C:\JavaDeployment\error.log"
          throw "Java application failed to start"
        }

    # Verify application
    - name: Verify Application
      shell: powershell
      run: |
        Start-Sleep -Seconds 3

        try {
          $response = Invoke-WebRequest `
            -Uri "http://127.0.0.1:8081" `
            -TimeoutSec 10

          Write-Host "Application is responding!"
          Write-Host "HTTP Status: $($response.StatusCode)"
        }
        catch {
          Write-Host "Application startup failed"
          Get-Content "C:\JavaDeployment\app.log"
          Get-Content "C:\JavaDeployment\error.log"
          throw
        }
    - name: Stop Existing Application
      shell: powershell
      run: |
        $processes = Get-CimInstance Win32_Process |
          Where-Object {
            $_.CommandLine -like "*C:\JavaDeployment\application.jar*"
          }

        foreach ($p in $processes) {
          Stop-Process -Id $p.ProcessId -Force
        }
    - name: Start Java Application
      shell: powershell
      run: |
        $process = Start-Process `
          -FilePath "java" `
          -ArgumentList "-jar C:\JavaDeployment\application.jar" `
          -WorkingDirectory "C:\JavaDeployment" `
          -RedirectStandardOutput "C:\JavaDeployment\app.log" `
          -RedirectStandardError "C:\JavaDeployment\error.log" `
          -PassThru

        Start-Sleep -Seconds 5

        if ($process.HasExited) {
          Get-Content "C:\JavaDeployment\error.log"
          throw "Java application failed to start"
        }
    - name: Verify Application
      shell: powershell
      run: |
        Start-Sleep -Seconds 3

        try {
          $response = Invoke-WebRequest `
            -Uri "http://127.0.0.1:8081" `
            -TimeoutSec 10

          Write-Host "Application is responding!"
          Write-Host "HTTP Status: $($response.StatusCode)"
        }
        catch {
          Write-Host "Application startup failed"
          Get-Content "C:\JavaDeployment\app.log"
          Get-Content "C:\JavaDeployment\error.log"
          throw
        }
